name: Update editors

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update editor source pins
        run: nix flake update mitos neovim-src
      - uses: actions/upload-artifact@v4
        with:
          name: updated-flake-lock
          path: flake.lock

  build:
    needs: update-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: updated-flake-lock
          path: updated-lock
      - run: cp updated-lock/flake.lock "$GITHUB_WORKSPACE/flake.lock"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: gtsaqib
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build Mitos and Neovim nightly
        run: nix build --accept-flake-config --print-build-logs .#mitos .#neovim-nightly

  commit-lock:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: updated-flake-lock
          path: updated-lock
      - run: cp updated-lock/flake.lock "$GITHUB_WORKSPACE/flake.lock"
      - name: Commit updated editor pins
        run: |
          if git diff --quiet -- flake.lock; then
            echo "Editor source pins are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "flake.lock: Update editor sources"
          git push
